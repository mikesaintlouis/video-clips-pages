<!DOCTYPE html>

<title>Grid Minimalista</title>
<style>
body { font-family: Georgia, serif; background:#fafafa; color:#222; padding:40px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:30px; max-width:1000px; margin:auto; }
.video-wrap { position:relative; padding-bottom:56.25%; height:0; }
.video-wrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; }
h1 { text-align:center; font-weight:normal; }
</style>
</head>
<body>
<h1>Grid Minimalista de Videoclips</h1>
<p style="text-align:center; max-width:700px; margin:0 auto 40px;">Una disposición limpia y editorial con estructura de cuadrícula, diferente a las demás páginas.</p>
<div class="grid">
<div class="video-wrap"><iframe src="https://www.youtube.com/embed/jNQXAC9IVRw" allowfullscreen></iframe></div>
<div class="video-wrap"><iframe src="https://player.vimeo.com/video/148751763" allowfullscreen></iframe></div>
<div class="video-wrap"><iframe src="https://www.dailymotion.com/embed/video/x2j0w3y" allowfullscreen></iframe></div>

</div>

</html>
